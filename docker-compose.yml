name: pokemon-api

services:
  db:
    container_name: db
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pokemon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "pokemon_db"]
      interval: 5s
      retries: 5

  backend:
    container_name: backend
    build: .
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      timeout: 3s
      retries: 5
      start_period: 15s
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:admin@db:5432/pokemon_db
      SERVICE_NAME: pokemon-backend
    ports:
      - "8000:8000"
    volumes:
      - ./alembic:/app/alembic

  db-seed:
    image: postgres:18
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./seed/seed.sql:/seed.sql
    entrypoint:
      ["psql", "-h", "db", "-U", "admin", "-d", "pokemon_db", "-f", "/seed.sql"]
    environment:
      PGPASSWORD: admin

  victorialogs:
    container_name: victorialogs
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=30d"
    ports:
      - "9428:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data

  vector:
    container_name: vector
    image: timberio/vector:0.44.0-debian
    depends_on:
      - victorialogs
    volumes:
      - ./observability/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    container_name: grafana
    image: grafana/grafana:11.4.0
    depends_on:
      - victorialogs
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  victorialogs_data:
  grafana_data:
